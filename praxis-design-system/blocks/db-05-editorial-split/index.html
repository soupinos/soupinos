<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB-05 · Editorial Split — Praxis-Ionian</title>
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/skin-ionian.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<section class="db-editorial-split" data-spacing="m">

  <div class="db-editorial-split__row" data-fx="fx-02 fx-01">
    <figure class="db-editorial-split__media">
      <div class="db-editorial-split__media-layer" data-fx-target="parallax" role="img" aria-label="Χέρια που δουλεύουν πηλό σε εργαστήρι"></div>
    </figure>
    <div class="db-editorial-split__text" data-fx-target="reveal">
      <p class="db-editorial-split__eyebrow">01 &middot; ΥΛΙΚΟ</p>
      <h3 class="db-editorial-split__title">Ό,τι αγγίζεται, κρίνεται</h3>
      <p class="db-editorial-split__body">Κάθε υλικό επιλέγεται για το πώς γερνάει, όχι μόνο για το πώς φωτογραφίζεται την πρώτη μέρα.</p>
    </div>
  </div>

  <div class="db-editorial-split__row db-editorial-split__row--reverse" data-fx="fx-02 fx-01">
    <figure class="db-editorial-split__media">
      <div class="db-editorial-split__media-layer" data-fx-target="parallax" role="img" aria-label="Ξύλινο εργαστήρι με εργαλεία στη σειρά"></div>
    </figure>
    <div class="db-editorial-split__text" data-fx-target="reveal">
      <p class="db-editorial-split__eyebrow">02 &middot; ΔΙΑΔΙΚΑΣΙΑ</p>
      <h3 class="db-editorial-split__title">Ο χρόνος είναι μέρος του σχεδίου</h3>
      <p class="db-editorial-split__body">Δεν βιαζόμαστε το κομμάτι που πρέπει να κρατήσει καιρό. Το ίδιο ισχύει και για το ψηφιακό σπίτι του.</p>
    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="../../fx/fx-core.js"></script>
<script src="../../fx/fx-catalog.js"></script>
</body>
</html>
