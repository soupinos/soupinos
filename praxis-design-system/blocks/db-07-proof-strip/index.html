    <div>
      <span class="db-proof-strip__number" data-fx-target="counter" data-fx-to="14">0</span>

    <div>
      <span class="db-proof-strip__number" data-fx-target="counter" data-fx-to="42">0</span>
      <span class="db-proof-strip__label">ΤΟΠΟΙ</span>

    &laquo;Ένιωσα ότι κατάλαβαν τον τόπο πριν καν ανοίξω το πρώτο σκίτσο.&raquo;
