<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB-08 · Gallery Immersive — Praxis-Ionian</title>
<link rel="stylesheet" href="../../tokens/core.css">
<link rel="stylesheet" href="../../tokens/skin-ionian.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<section class="db-gallery-immersive px-bleed" data-fx="fx-09" data-fx-distance="60">
  <div class="db-gallery-immersive__track" data-fx-target="track">

    <figure class="db-gallery-immersive__frame" data-fx="fx-06">
      <div class="db-gallery-immersive__media" data-fx-target="kenburns" role="img" aria-label="Ελαιώνας το πρωί"></div>
      <figcaption class="db-gallery-immersive__caption">Ελαιώνας &middot; πρωί</figcaption>
    </figure>

    <figure class="db-gallery-immersive__frame" data-fx="fx-06">
      <div class="db-gallery-immersive__media" data-fx-target="kenburns" role="img" aria-label="Πέτρινο καλντερίμι"></div>
      <figcaption class="db-gallery-immersive__caption">Καλντερίμι &middot; παλιά πόλη</figcaption>
    </figure>

    <figure class="db-gallery-immersive__frame" data-fx="fx-06">
      <div class="db-gallery-immersive__media" data-fx-target="kenburns" role="img" aria-label="Ακτή στο ηλιοβασίλεμα"></div>
      <figcaption class="db-gallery-immersive__caption">Ακτή &middot; δύση</figcaption>
    </figure>

    <figure class="db-gallery-immersive__frame" data-fx="fx-06">
      <div class="db-gallery-immersive__media" data-fx-target="kenburns" role="img" aria-label="Εργαστήρι με εργαλεία"></div>
      <figcaption class="db-gallery-immersive__caption">Εργαστήρι &middot; χειροτεχνία</figcaption>
    </figure>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="../../fx/fx-core.js"></script>
<script src="../../fx/fx-catalog.js"></script>
</body>
</html>
