<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxis Intake Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Tokens (praxis brand) ──────────────────────────────────────────── */
  :root {
    --bg:        #080808;
    --bg2:       #0f0f0f;
    --bg3:       #161616;
    --border:    rgba(255, 255, 255, 0.08);
    --border-2:  rgba(255, 255, 255, 0.14);
    --red:       #FF3B00;
    --red-soft:  rgba(255, 59, 0, 0.10);
    --red-line:  rgba(255, 59, 0, 0.30);
    --white:     #F0EDE8;
    --ink:       #a8a6a1;
    --muted:     #666;
    --font-h:    'Exo 2', sans-serif;
    --font-b:    'DM Sans', sans-serif;
    --ease:      cubic-bezier(.22, .61, .36, 1);
  }

  /* ── Reset ──────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-b);
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  h1, h2, h3 { font-family: var(--font-h); font-weight: 700; line-height: 1.1; }

  button { font-family: var(--font-b); cursor: pointer; }

  /* ── Layout shell ───────────────────────────────────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    height: 100%;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header.topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }

  .logo {
    font-family: var(--font-h);
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .logo .dot { color: var(--red); }
  .logo small {
    display: block;
    font-family: var(--font-b);
    font-weight: 400;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--ink);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 8px 14px;
    border-radius: 4px;
    transition: border-color .2s, color .2s, background .2s;
    white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--red); color: var(--white); background: var(--red-soft); }

  /* ── API key panel ──────────────────────────────────────────────────── */
  .keybar {
    flex: 0 0 auto;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  .keybar.hidden { display: none; }
  .keybar label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .key-row { display: flex; gap: 8px; }
  .keybar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: 4px;
    color: var(--white);
    font-family: var(--font-b);
    font-size: 0.85rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color .2s;
  }
  .keybar input:focus { border-color: var(--red); }
  .keybar .hint {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .btn-primary {
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    padding: 10px 18px;
    border-radius: 4px;
    transition: filter .2s, transform .1s;
    white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  /* ── Chat stream ────────────────────────────────────────────────────── */
  main.chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 4px; }
  .msg .who {
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.ai { align-self: flex-start; }
  .msg.ai .bubble {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
    color: var(--white);
  }
  .msg.ai .who { color: var(--red); }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble {
    background: var(--red-soft);
    border: 1px solid var(--red-line);
    border-top-right-radius: 2px;
    color: var(--white);
  }

  /* typing indicator */
  .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red);
    opacity: .4;
    animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* error banner */
  .banner {
    align-self: center;
    max-width: 92%;
    background: rgba(255, 59, 0, 0.08);
    border: 1px solid var(--red-line);
    color: #ffb3a0;
    font-size: 0.82rem;
    padding: 10px 14px;
    border-radius: 6px;
    text-align: center;
  }

  /* ── Composer ───────────────────────────────────────────────────────── */
  footer.composer {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .composer-row { display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    color: var(--white);
    font-family: var(--font-b);
    font-size: 0.92rem;
    line-height: 1.5;
    padding: 11px 14px;
    outline: none;
    max-height: 160px;
    transition: border-color .2s;
  }
  .composer textarea:focus { border-color: var(--red); }
  .composer textarea:disabled { opacity: .5; }

  .actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .actions .note { font-size: 0.7rem; color: var(--muted); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-2);
    color: var(--white);
    font-weight: 500;
    font-size: 0.8rem;
    padding: 9px 16px;
    border-radius: 4px;
    transition: border-color .2s, background .2s;
  }
  .btn-ghost:hover { border-color: var(--red); background: var(--red-soft); }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Brief modal ────────────────────────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    width: 100%;
    max-width: 680px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 1.05rem; }
  .modal-body {
    overflow-y: auto;
    padding: 20px;
  }
  .modal-body pre {
    font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    font-size: 0.82rem;
    line-height: 1.6;
    color: var(--white);
    white-space: pre-wrap;
    word-wrap: break-word;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .modal-foot {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  /* ── Scrollbars ─────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #222; }

  /* ── Mobile ─────────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .app { border: none; }
    header.topbar { padding: 12px 14px; }
    main.chat { padding: 16px 14px; }
    footer.composer { padding: 12px 14px; }
    .keybar { padding: 12px 14px; }
    .msg { max-width: 94%; }
    .actions .note { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="topbar">
    <div class="logo">praxis<span class="dot">.</span><small>Intake Agent</small></div>
    <button class="icon-btn" id="toggleKey" type="button">API Key</button>
  </header>

  <!-- API key -->
  <section class="keybar" id="keybar" aria-label="DeepSeek API Key">
    <label for="apiKey">DeepSeek API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <button class="btn-primary" id="saveKey" type="button">Αποθήκευση</button>
    </div>
    <p class="hint">Το key μένει τοπικά στον browser σου.</p>
  </section>

  <!-- Chat -->
  <main class="chat" id="chat" aria-live="polite"></main>

  <!-- Composer -->
  <footer class="composer">
    <div class="composer-row">
      <textarea id="input" rows="1" placeholder="Γράψε την απάντησή σου…"></textarea>
      <button class="btn-primary" id="send" type="button">Send</button>
    </div>
    <div class="actions">
      <span class="note">Enter για αποστολή · Shift+Enter για νέα γραμμή</span>
      <button class="btn-ghost" id="genBrief" type="button">Δημιουργία Brief</button>
    </div>
  </footer>
</div>

<!-- Brief modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="briefTitle">
    <div class="modal-head">
      <h2 id="briefTitle">Brief</h2>
      <button class="icon-btn" id="closeBrief" type="button">✕ Κλείσιμο</button>
    </div>
    <div class="modal-body">
      <pre id="briefText"></pre>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="copyBrief" type="button">Copy</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── Config ───────────────────────────────────────────────────────── */
  var API_URL    = 'https://api.deepseek.com/chat/completions';
  var MODEL      = 'deepseek-chat';
  var KEY_STORE  = 'praxis_deepseek_key';

  /* ── System prompt: the interviewer persona ───────────────────────── */
  var SYSTEM_PROMPT = [
    'Είσαι έμπειρος brand strategist της praxis — ζεστός, ανθρώπινος, με γνήσια περιέργεια.',
    'Παίρνεις συνέντευξη από έναν νέο πελάτη για να χτιστεί το brand και το website του.',
    'Στόχος σου: να ανοίξει την καρδιά του και να σου πει την αληθινή του ιστορία.',
    '',
    'ΤΕΧΝΙΚΕΣ:',
    '- Κάνε ΜΙΑ ερώτηση τη φορά. Σύντομα, καθαρά, ζεστά.',
    '- Open-ended ερωτήσεις. Ζήτα "πες μου περισσότερα" όταν κάτι αξίζει σκάψιμο.',
    '- Κάνε follow-up που πατάει πάνω στην προηγούμενη απάντησή του (mirroring — επανέλαβε λέξεις-κλειδιά του).',
    '- Δείξε ότι ακούς: ένα σύντομο σχόλιο/αναγνώριση πριν την επόμενη ερώτηση.',
    '',
    'ΥΦΟΣ:',
    '- Ζεστό, ανθρώπινο, σαν κουβέντα σε καφέ. ΟΧΙ ανάκριση, ΟΧΙ checklist, ΟΧΙ χειραγώγηση.',
    '- Μίλα στα Ελληνικά, στον ενικό, με σεβασμό.',
    '- Μη ρωτάς πολλά μαζί. Μην κάνεις την κουβέντα να μοιάζει φόρμα.',
    '',
    'ΘΕΜΑΤΑ ΠΟΥ ΘΕΛΕΙΣ ΝΑ ΚΑΛΥΨΕΙΣ ΦΥΣΙΚΑ (όχι ξερά, μέσα από τη ροή):',
    '- Ποιοι είναι & η ιστορία τους (πώς ξεκίνησαν, το "γιατί" τους).',
    '- Κλάδος & τοποθεσία.',
    '- Τι τους ξεχωρίζει αληθινά από τον ανταγωνισμό.',
    '- Ποιον πελάτη θέλουν να προσελκύσουν & τι να νιώθει όταν τους συναντά.',
    '- Υπηρεσίες & τιμές (αν θέλει να τις μοιραστεί).',
    '- Τι τους τσαντίζει / τι κάνει λάθος ο ανταγωνισμός.',
    '- Στοιχεία επικοινωνίας (τηλ/WhatsApp/email).',
    '- Γλώσσες που θέλουν στο site.',
    '- Προτίμηση ύφους/αισθητικής.',
    '',
    'ΥΠΟΧΡΕΩΤΙΚΑ ΠΕΔΙΑ (hard requirements):',
    'Πριν κλείσεις τη συνέντευξη, βεβαιώσου ότι έχεις ρωτήσει ΡΗΤΑ και πάρει απάντηση για:',
    '  • Ακριβές όνομα επιχείρησης (όχι περιγραφή — το όνομα)',
    '  • Τηλέφωνο ή/και WhatsApp επικοινωνίας',
    '  • Τιμές υπηρεσιών (έστω εύρος, π.χ. "από €X")',
    'Αν λείπει κάποιο, ζήτα το με φυσικό τρόπο μέσα στη ροή — "πες μου και το τηλέφωνο που θα βλέπουν οι πελάτες", "πόσο περίπου κοστίζει αυτό που κάνεις;" κ.λπ.',
    'ΜΗΝ κλείσεις τη συνέντευξη με κενό υποχρεωτικό πεδίο.',
    '',
    'CHECKPOINT πριν το κλείσιμο:',
    'Πριν προτείνεις "Δημιουργία Brief", κάνε εσωτερική επαλήθευση:',
    '  ✓ Έχω ακριβές όνομα επιχείρησης;',
    '  ✓ Έχω τηλέφωνο ή WhatsApp;',
    '  ✓ Έχω τιμές ή τουλάχιστον εύρος τιμών;',
    'Αν κάποιο είναι ΟΧΙ → ρώτα πρώτα. Μόνο όταν και τα τρία είναι ΝΑΙ, προχώρα στο κλείσιμο.',
    '',
    'ΚΛΕΙΣΙΜΟ:',
    '- Όταν νιώσεις ότι έχεις αρκετό ουσιαστικό υλικό ΚΑΙ έχεις τα τρία υποχρεωτικά, κλείσε ευγενικά και ζεστά.',
    '- Πες του ότι έχεις μια καθαρή εικόνα και ότι μπορεί να πατήσει "Δημιουργία Brief".',
    '- Μην το παρατραβάς — ποιότητα πάνω από ποσότητα.'
  ].join('\n');

  /* ── Brief synthesis prompt ───────────────────────────────────────── */
  var BRIEF_PROMPT = [
    'Με βάση ΟΛΗ τη συζήτηση παραπάνω, σύνθεσε ένα δομημένο brief στα Ελληνικά.',
    'Βγάλε ΜΟΝΟ το παρακάτω block, με ΑΚΡΙΒΩΣ αυτά τα labels και αυτή τη μορφή.',
    'Μη βάζεις markdown, μη βάζεις backticks, μη βάζεις τίποτα πριν ή μετά το block.',
    'Αν κάποιο στοιχείο δεν ειπώθηκε, γράψε "—" ή κάνε λογική πρόταση και σημείωσέ το.',
    'Στο SKIN διάλεξε ΕΝΑ από: praxis / akira / cyberpunk / matrix / gold / ghost / vapor,',
    'με βάση το ύφος και τον κλάδο του πελάτη.',
    'Στις ΣΗΜΕΙΩΣΕΙΣ βάλε αυτούσιες φράσεις/αποσπάσματα του πελάτη που αξίζουν για copy.',
    '',
    '═══ ΟΔΗΓΙΕΣ ΠΡΟΣ ORCHESTRATOR ═══',
    'ΕΠΙΧΕΙΡΗΣΗ:     [όνομα]',
    'ΚΛΑΔΟΣ:         [κλάδος]',
    'ΤΟΠΟΘΕΣΙΑ:      [πόλη/περιοχή]',
    'POSITIONING:    [τι τους ξεχωρίζει αληθινά — 1-2 γραμμές]',
    'TONE:           [ύφος φωνής που ταιριάζει]',
    'ΚΟΙΝΟ:          [ποιον πελάτη θέλουν & τι να νιώθει]',
    'ΥΠΗΡΕΣΙΕΣ:      [λίστα + τιμές αν υπάρχουν]',
    'ΠΟΝΟΣ:          [τι τους τσαντίζει/ανταγωνισμός]',
    'ΕΠΙΚΟΙΝΩΝΙΑ:    [τηλ/WhatsApp/email]',
    'ΓΛΩΣΣΕΣ:        [π.χ. GR + EN]',
    'SKIN:           [πρόταση: praxis/akira/cyberpunk/matrix/gold/ghost/vapor]',
    '─── ΣΗΜΕΙΩΣΕΙΣ ───',
    '[ελεύθερο κείμενο: αποσπάσματα/φράσεις του πελάτη που αξίζουν για copy]',
    '═══════════════════════════════'
  ].join('\n');

  /* ── Opening greeting (seeded, not an API call) ───────────────────── */
  var OPENING = 'Γεια σου! Χαίρομαι πολύ που τα λέμε. Πριν μπούμε στα τεχνικά, θέλω απλά να σε γνωρίσω. Πες μου λίγο — ποιοι είστε και πώς ξεκίνησε όλο αυτό;';

  /* ── State ────────────────────────────────────────────────────────── */
  var messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    { role: 'assistant', content: OPENING }
  ];
  var busy = false;

  /* ── DOM refs ─────────────────────────────────────────────────────── */
  var $chat     = document.getElementById('chat');
  var $input    = document.getElementById('input');
  var $send     = document.getElementById('send');
  var $genBrief = document.getElementById('genBrief');
  var $keybar   = document.getElementById('keybar');
  var $apiKey   = document.getElementById('apiKey');
  var $saveKey  = document.getElementById('saveKey');
  var $toggleKey= document.getElementById('toggleKey');
  var $overlay  = document.getElementById('overlay');
  var $briefText= document.getElementById('briefText');
  var $copyBrief= document.getElementById('copyBrief');
  var $closeBrief = document.getElementById('closeBrief');

  /* ── Key management ───────────────────────────────────────────────── */
  function getKey() {
    try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; }
  }
  function setKey(v) {
    try { localStorage.setItem(KEY_STORE, v); } catch (e) {}
  }

  function initKey() {
    var k = getKey();
    if (k) {
      $apiKey.value = k;
      $keybar.classList.add('hidden');
    } else {
      $keybar.classList.remove('hidden');
    }
  }

  $saveKey.addEventListener('click', function () {
    var v = $apiKey.value.trim();
    if (!v) { $apiKey.focus(); return; }
    setKey(v);
    $keybar.classList.add('hidden');
    $input.focus();
  });

  $toggleKey.addEventListener('click', function () {
    $keybar.classList.toggle('hidden');
    if (!$keybar.classList.contains('hidden')) $apiKey.focus();
  });

  /* ── Rendering ────────────────────────────────────────────────────── */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function addMessage(role, text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'assistant' ? 'ai' : 'user');
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'assistant' ? 'praxis' : 'εσύ';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    $chat.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function addTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = 'typingMsg';
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = 'praxis';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    $chat.appendChild(wrap);
    scrollDown();
    return wrap;
  }
  function removeTyping() {
    var t = document.getElementById('typingMsg');
    if (t) t.remove();
  }

  function addBanner(text) {
    var b = document.createElement('div');
    b.className = 'banner';
    b.textContent = text;
    $chat.appendChild(b);
    scrollDown();
  }

  function scrollDown() { $chat.scrollTop = $chat.scrollHeight; }

  /* ── API call ─────────────────────────────────────────────────────── */
  function callDeepSeek(msgs, temperature) {
    var key = getKey();
    if (!key) {
      return Promise.reject(new Error('NO_KEY'));
    }
    return fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify({
        model: MODEL,
        messages: msgs,
        temperature: temperature,
        stream: false
      })
    }).then(function (res) {
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error('BAD_KEY');
        return res.text().then(function (t) { throw new Error('HTTP_' + res.status + ': ' + t.slice(0, 160)); });
      }
      return res.json();
    }).then(function (data) {
      var c = data && data.choices && data.choices[0] && data.choices[0].message;
      if (!c || !c.content) throw new Error('EMPTY');
      return c.content.trim();
    });
  }

  function errorText(err) {
    if (err.message === 'NO_KEY')  return 'Δεν υπάρχει API key. Πάτησε «API Key» πάνω δεξιά και βάλε το key σου.';
    if (err.message === 'BAD_KEY') return 'Το API key δεν είναι έγκυρο. Έλεγξέ το και ξαναπροσπάθησε.';
    if (err.message === 'EMPTY')   return 'Το AI δεν επέστρεψε απάντηση. Δοκίμασε ξανά.';
    if (/Failed to fetch|NetworkError|network/i.test(err.message)) {
      return 'Πρόβλημα δικτύου — δεν ήταν δυνατή η σύνδεση με το DeepSeek. Έλεγξε τη σύνδεσή σου.';
    }
    return 'Κάτι πήγε στραβά: ' + err.message;
  }

  /* ── Interview send ───────────────────────────────────────────────── */
  function setBusy(on) {
    busy = on;
    $send.disabled = on;
    $genBrief.disabled = on;
    $input.disabled = on;
  }

  function send() {
    if (busy) return;
    var text = $input.value.trim();
    if (!text) return;

    if (!getKey()) {
      $keybar.classList.remove('hidden');
      $apiKey.focus();
      addBanner('Βάλε πρώτα το DeepSeek API key σου για να ξεκινήσουμε.');
      return;
    }

    addMessage('user', text);
    messages.push({ role: 'user', content: text });
    $input.value = '';
    autosize();

    setBusy(true);
    addTyping();

    callDeepSeek(messages, 0.85).then(function (reply) {
      removeTyping();
      addMessage('assistant', reply);
      messages.push({ role: 'assistant', content: reply });
    }).catch(function (err) {
      removeTyping();
      addBanner(errorText(err));
    }).then(function () {
      setBusy(false);
      $input.focus();
    });
  }

  /* ── Brief generation ─────────────────────────────────────────────── */
  function generateBrief() {
    if (busy) return;
    if (!getKey()) {
      $keybar.classList.remove('hidden');
      $apiKey.focus();
      addBanner('Βάλε πρώτα το DeepSeek API key σου.');
      return;
    }
    // need at least one real exchange
    var hasUser = messages.some(function (m) { return m.role === 'user'; });
    if (!hasUser) {
      addBanner('Κάνε πρώτα λίγη κουβέντα ώστε να υπάρχει υλικό για το brief.');
      return;
    }

    setBusy(true);
    var prevLabel = $genBrief.textContent;
    $genBrief.textContent = 'Σύνθεση…';

    var briefMsgs = messages.concat([{ role: 'user', content: BRIEF_PROMPT }]);

    callDeepSeek(briefMsgs, 0.4).then(function (brief) {
      $briefText.textContent = brief;
      openModal();
    }).catch(function (err) {
      addBanner(errorText(err));
    }).then(function () {
      setBusy(false);
      $genBrief.textContent = prevLabel;
    });
  }

  /* ── Modal ────────────────────────────────────────────────────────── */
  function openModal()  { $overlay.classList.add('open'); }
  function closeModal() { $overlay.classList.remove('open'); }

  $closeBrief.addEventListener('click', closeModal);
  $overlay.addEventListener('click', function (e) { if (e.target === $overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  $copyBrief.addEventListener('click', function () {
    var text = $briefText.textContent;
    var done = function () {
      var t = $copyBrief.textContent;
      $copyBrief.textContent = '✓ Αντιγράφηκε';
      setTimeout(function () { $copyBrief.textContent = t; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ── Composer behaviour ───────────────────────────────────────────── */
  function autosize() {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 160) + 'px';
  }
  $input.addEventListener('input', autosize);
  $input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  $send.addEventListener('click', send);
  $genBrief.addEventListener('click', generateBrief);

  /* ── Boot ─────────────────────────────────────────────────────────── */
  initKey();
  addMessage('assistant', OPENING);
  $input.focus();
})();
</script>
</body>
</html>
